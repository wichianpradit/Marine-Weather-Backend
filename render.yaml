services:
  - type: web
    name: marine-weather-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: TMD_PAT
        sync: false
      - key: DEFAULT_LAT
        value: "6.8695"
      - key: DEFAULT_LON
        value: "101.2505"
      - key: DEFAULT_NAME
        value: "Pattani Sea"
